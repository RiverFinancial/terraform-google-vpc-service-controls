name: 'ingress-replacement'

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'modules/regular_service_perimeter/**'
      - 'test/fixtures/ingress_replacement/**'
      - 'test/integration/ingress_replacement/**'
      - 'test/integration/go.mod'
      - 'test/integration/go.sum'
      - '.github/workflows/ingress-replacement.yaml'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@v6'
      - uses: 'actions/setup-go@v6'
        with:
          go-version-file: 'test/integration/go.mod'
          cache-dependency-path: 'test/integration/go.sum'
      - uses: 'hashicorp/setup-terraform@v3'
        with:
          terraform_version: '1.15.3'
          terraform_wrapper: false
      - name: Verify ingress replacement order without cloud credentials
        working-directory: test/integration
        run: go test ./ingress_replacement -v
